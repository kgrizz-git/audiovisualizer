# .pre-commit-config.yaml
#
# Copy this file to your project root and run:
#   pip install pre-commit && pre-commit install
#
# Update hook revisions:
#   pre-commit autoupdate
#
# Run manually against all files:
#   pre-commit run --all-files
#
# See hooks/README.md for selection guidance and tier explanations.
# Remove or comment out any block that does not apply to your project.

repos:
  # ── Harness policy checks ──────────────────────────────────────────────────
  # These enforce policies/ rules. Paths assume you've copied hooks/ to your repo.
  - repo: local
    hooks:
      - id: check-file-size
        name: "policy: file size & counts"
        entry: python hooks/scripts/check_file_size.py
        language: python
        types: [file]
        pass_filenames: true
        description: "Enforces policies/file-size-and-counts.md (line caps, binary limits)."

      - id: check-doc-freshness
        name: "policy: doc freshness"
        entry: python hooks/scripts/check_doc_freshness.py
        language: python
        types: [markdown]
        pass_filenames: true
        description: "Enforces policies/doc-freshness.md (Last reviewed marker + staleness)."

      - id: check-todo-limits
        name: "policy: TODO / to_do size"
        entry: python hooks/scripts/check_todo_limits.py
        language: python
        files: '(^|/)(to_do|TODO|todo|TO_DO|backlog)\.md$'
        pass_filenames: true
        description: "Warns/blocks oversized living backlog files (policies/plans-and-todos.md)."

      - id: check-license-inventory
        name: "policy: license inventory freshness"
        entry: python hooks/scripts/check_license_inventory.py --check
        language: python
        pass_filenames: false
        always_run: true
        files: ''
        description: "Ensures third-party license inventory matches package-lock.json and policy gates (inventory/third-party-licenses.md)."

      # Strict PII/PHI guard: enable only after a human has created and reviewed
      # .phi-security-approvals.json from hooks/phi-security-approvals.json.example.
      # It ignores pre-commit filenames and scans every file tracked in the Git index,
      # including tests and workbooks. See inventory/medical-data-security.md.
      # - id: check-sensitive-data
      #   name: "security: strict PII/PHI and opaque-file gate"
      #   entry: python hooks/scripts/check_sensitive_data.py
      #   language: python
      #   pass_filenames: false
      #   always_run: true
      #   description: "Blocks suspected PII/PHI, hardcoded usernames/paths, images, DICOM, extensionless, and opaque files without exact human approval."

      # Strict commit-message gate for medical/regulated repositories. Enable with
      # check-sensitive-data and never allowlist a commit message: use a sanitized
      # issue or incident reference instead of PHI, usernames, paths, or endpoints.
      # - id: check-commit-message-sensitive-data
      #   name: "security: strict sensitive commit-message gate"
      #   entry: python hooks/scripts/check_commit_message_sensitive_data.py
      #   language: python
      #   stages: [commit-msg]
      #   pass_filenames: true
      #   description: "Blocks PII/PHI, local paths/usernames, private IPs, and internal endpoints in commit messages."

      # Structural sensitive-data gates (see policies/sensitive-data-scan-gates.md).
      # Each is inert until its root config file exists, so it is safe to leave wired.
      # - id: check-gitignore-protected
      #   name: "security: protected .gitignore rules"
      #   entry: python hooks/scripts/check_gitignore_protected.py
      #   language: python
      #   pass_filenames: false
      #   always_run: true
      #   description: "Blocks removal of a required .gitignore rule (config: .gitignore-protected)."

      # - id: check-forbidden-paths
      #   name: "security: forbidden tracked paths"
      #   entry: python hooks/scripts/check_forbidden_paths.py
      #   language: python
      #   pass_filenames: false
      #   always_run: true
      #   description: "Blocks tracking files under never-commit paths (config: .forbidden-paths)."

      # - id: check-scan-contract
      #   name: "security: heavy-scanner contract"
      #   entry: python hooks/scripts/check_scan_contract.py
      #   language: python
      #   pass_filenames: false
      #   always_run: true
      #   description: "Blocks when a required local scanner (Presidio/OCR/phi-scan/HoundDog/SonarQube CE) is stale vs covered files (config: .scan-contract.json + .scan-ledger.json)."

      # Optional: uncomment if your team uses gitignored backups/ before edits
      # - id: prune-backups
      #   name: "hygiene: prune old backups/"
      #   entry: bash hooks/scripts/prune_backups.sh
      #   language: system
      #   pass_filenames: false
      #   always_run: true

  # ── Secret scanning (always on) ────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: "secrets: gitleaks scan"

  # ── General file hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]          # 5 MB hard gate; mirrors policy
        name: "size: large file gate"
      - id: detect-private-key
        name: "secrets: private key detect"
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]              # remove --unsafe if you don't use YAML anchors
      - id: check-toml
      - id: check-json
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── Python (remove block if not a Python project) ──────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        name: "python: ruff lint"
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: "python: ruff format"

  # ── Markdown ───────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        name: "docs: markdownlint"
        args:
          - --disable
          - MD013   # line length (incompatible with wide tables)
          - MD033   # inline HTML (sometimes useful)
          - --

  # ── Shell ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: "shell: shellcheck"

  # ── YAML / TOML formatting ─────────────────────────────────────────────────
  # Uncomment if you want opinionated YAML formatting:
  # - repo: https://github.com/google/yamlfmt
  #   rev: v0.13.0
  #   hooks:
  #     - id: yamlfmt

  # ── SAST: Semgrep (optional, requires semgrep installed) ───────────────────
  # Runs OWASP Top 10 + language-specific rulesets. See inventory/security-quality.md.
  # Uncomment and choose rulesets for your language:
  # - repo: https://github.com/semgrep/semgrep
  #   rev: v1.112.0
  #   hooks:
  #     - id: semgrep
  #       name: "sast: semgrep"
  #       args:
  #         - --config=p/owasp-top-ten
  #         - --config=p/python-security    # or p/javascript, p/typescript, p/golang
  #         - --error                       # exit non-zero on findings
  #       additional_dependencies: []

  # ── IaC scanning (uncomment if using Terraform / Kubernetes / CloudFormation)
