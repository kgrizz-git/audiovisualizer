# .github/workflows/ci.yml
#
# AudioVisualizer CI:
#   Validate  — lint, Vitest+coverage, type-check, production build, npm audit,
#               license inventory (needs node_modules / license-checker)
#   Policy    — public-release clean gate, policy-hook unit tests
#   Secrets   — gitleaks
#   SAST      — Semgrep (pinned image; TypeScript + Python rulesets)
#
# Required status-check names for branch protection / rulesets:
#   Validate, Policy, Secret scan, SAST (Semgrep)
# Target: Validate under ~5 minutes on a cold runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # --ignore-scripts: block package lifecycle scripts in CI (Sonar S6505).
        # prepare (hooks/install.sh) is not needed on runners.
        run: npm ci --ignore-scripts

      - name: Lint, test with coverage, type-check, and production build
        run: npm run validate

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit dependencies (high/critical)
        # Hard gate on main pushes; advisory on PRs so fresh advisories do not
        # block unrelated work overnight (still visible as a failed step).
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --audit-level=high

      - name: License inventory gate
        # Must run after npm ci: inventory is compared against license-checker
        # enrichment that needs node_modules / npx.
        # The script returns distinct exit codes:
        #   0 pass, 1 license-policy violation (unknown license, production
        #     strong-copyleft, human-review), 2 stale inventory drift only.
        # Policy violations (1) ALWAYS fail CI. Stale drift (2) is expected on
        # Dependabot lockfile PRs (CI cannot push back to the bot branch), so it
        # is advisory there only — the maintainer runs
        # `python hooks/scripts/check_license_inventory.py --update` and commits
        # before merging. On main pushes / other PRs, stale drift also hard-fails.
        env:
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          python hooks/scripts/check_license_inventory.py --check
          rc=$?
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 2 ] && [ "$IS_DEPENDABOT" = "true" ]; then
            echo "::warning::License inventory is stale on a Dependabot PR — advisory only; run --update before merge."
            exit 0
          fi
          exit "$rc"

      - name: License inventory unit tests
        # Same dependency: RepoIntegrationSmoke runs --check against this checkout.
        run: python -m unittest tests.hooks.test_check_license_inventory -v

  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public-release clean gate (emails, absolute paths, private IPs)
        # --redact: omit matched tokens from CI logs; local hooks stay unredacted.
        run: python hooks/scripts/check_public_repo_clean.py --repo-root . --redact

      - name: Policy hook unit tests
        run: >
          python -m unittest
          tests.test_policy_hooks_smoke
          tests.hooks.test_path_guard
          tests.ci.test_path_guard_and_open_prs
          -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pin to full commit SHA (Sonar S7637 / supply-chain hygiene).
      # v3 = Node 24 runtime (v2/Node 20 removed from hosted runners 2026-09-16).
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    # Skip Dependabot lockfile PRs — SAST adds little signal there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Pin tag + digest; bump deliberately when refreshing Semgrep.
    container:
      image: semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan TypeScript and Python rules
        # p/python-security 404s in the registry; use p/python + p/typescript.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/python \
            --error \
            --quiet \
            src/ hooks/scripts/ tests/ ci/scripts/
