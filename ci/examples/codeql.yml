# ci/examples/codeql.yml
# Copy to .github/workflows/codeql.yml to activate.
# CodeQL deep static analysis — runs on PRs to main and weekly.
# Requires GitHub Advanced Security (free for public repos; GHAS license for private).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 3"   # Wednesdays at 04:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add languages your repo uses. Supported: c-cpp, csharp, go, java-kotlin,
        # javascript-typescript, python, ruby, swift
        language: [python]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
