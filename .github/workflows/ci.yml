# .github/workflows/ci.yml
#
# AudioVisualizer CI:
#   Validate  — lint, Vitest+coverage, type-check, production build, npm audit,
#               license inventory (needs node_modules / license-checker)
#   Policy    — public-release clean gate, policy-hook unit tests
#   Secrets   — gitleaks
#   SAST      — Semgrep (pinned image; TypeScript + Python rulesets)
#
# Required status-check names for branch protection / rulesets:
#   Validate, Policy, Secret scan, SAST (Semgrep)
# Target: Validate under ~5 minutes on a cold runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Lint, test with coverage, type-check, and production build
        run: npm run validate

      - name: Upload coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit dependencies (high/critical)
        # Hard gate on main pushes; advisory on PRs so fresh advisories do not
        # block unrelated work overnight (still visible as a failed step).
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm audit --audit-level=high

      - name: License inventory gate
        # Must run after npm ci: inventory is compared against license-checker
        # enrichment that needs node_modules / npx.
        # Hard gate everywhere; on Dependabot lockfile PRs the committed
        # inventory is expected to be stale (CI cannot push back to the bot
        # branch), so the step is advisory — the maintainer runs
        # `python hooks/scripts/check_license_inventory.py --update` and
        # commits before merging. Still a hard gate on main pushes / other PRs.
        continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
        run: python hooks/scripts/check_license_inventory.py --check

      - name: License inventory unit tests
        # Same dependency: RepoIntegrationSmoke runs --check against this checkout.
        run: python -m unittest tests.hooks.test_check_license_inventory -v

  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Public-release clean gate (emails, absolute paths, private IPs)
        # --redact: omit matched tokens from CI logs; local hooks stay unredacted.
        run: python hooks/scripts/check_public_repo_clean.py --repo-root . --redact

      - name: Policy hook unit tests
        run: python -m unittest tests.test_policy_hooks_smoke -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    # Skip Dependabot lockfile PRs — SAST adds little signal there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Pin tag + digest; bump deliberately when refreshing Semgrep.
    container:
      image: semgrep/semgrep:1.169.0@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan TypeScript and Python rules
        # p/python-security 404s in the registry; use p/python + p/typescript.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/python \
            --error \
            --quiet \
            src/ hooks/scripts/ tests/ ci/scripts/
