# .github/workflows/dependency-audit.yml
#
# Weekly scheduled npm audit. (The known-vulnerable-actions check moved to
# zizmor.yml, which runs every zizmor audit.)
# ci.yml only audits on push/PR (advisory on PRs), so on a quiet repo a newly
# published high/critical advisory against package-lock.json would never turn
# CI red. This run fails on the same scope as ci.yml's "Audit dependencies
# (high/critical)" step.
#
# npm audit reads package-lock.json directly — no `npm ci` / node_modules, and
# no npm cache (setup-node's cache post-step fails when ~/.npm was never
# populated).
#
# GHA usage estimate (policies/github-actions-usage.md): ~4–5 scheduled runs per
# month (+ occasional manual dispatch) × 1 job on ubuntu-latest, each billed as
# at least 1 minute ≈ 4–5 min/month; no artifacts or caches.
#
# GitHub disables scheduled workflows in a public repository after 60 days with
# no repository activity. If that happens, re-enable this workflow from the
# Actions tab; Dependabot alerts keep working regardless.

name: Dependency audit

on:
  schedule:
    # Mondays 05:17 UTC — off the top of the hour to avoid scheduler congestion.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit dependencies (high/critical)
        # Hard gate (no continue-on-error): a failing scheduled run is the signal.
        run: npm audit --audit-level=high
