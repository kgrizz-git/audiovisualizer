# Copy to .github/workflows/strict-sensitive-data.yml for a medical/regulated repo.
# Before enabling, a human must create and approve .phi-security-approvals.json from
# hooks/phi-security-approvals.json.example. Make this job a required branch-ruleset check.

name: Strict sensitive-data gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sensitive-data:
    name: security / sensitive data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file without printing matches
        run: python3 hooks/scripts/check_sensitive_data.py
