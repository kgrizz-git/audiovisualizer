# .github/dependabot.yml
# Copied from ci/examples/dependabot.yml (pip entry omitted: this repo has no
# Python package manifest — hooks/ and ci/ scripts are stdlib-only).
# Dependabot keeps dependencies and GitHub Actions versions current.
# CI already tolerates bot PRs: license-inventory drift is advisory on
# Dependabot branches and Semgrep skips them; Secret scan still runs
# (see .github/workflows/ci.yml). Stale inventory is regenerated and committed
# automatically by .github/workflows/dependabot-license-inventory.yml.

version: 2
updates:
  # Node / npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monthly on the 18th at 12:00 Eastern (built-in "monthly" only runs on the 1st).
      interval: cron
      cronjob: "0 12 18 * *"
      timezone: "America/New_York"
    # Custom labels replace Dependabot's defaults, so keep "dependencies".
    labels: ["dependencies", "javascript", "license-inventory"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  # GitHub Actions versions — always enable this
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Monthly on the 18th at 12:00 Eastern (built-in "monthly" only runs on the 1st).
      interval: cron
      cronjob: "0 12 18 * *"
      timezone: "America/New_York"
    groups:
      github-actions-minor:
        update-types: ["minor", "patch"]
