# .github/workflows/ci.yml
#
# AudioVisualizer CI: app validate, coverage (informational), npm audit,
# license inventory, public-release clean gate, policy hook tests, gitleaks,
# and Semgrep SAST. Target: validate job under ~5 minutes on a cold runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Test, type-check, and production build
        run: npm run validate

      - name: Test coverage (informational)
        # No coverage thresholds — reports only. continue-on-error so tooling
        # drift cannot block merges while validate already gates correctness.
        continue-on-error: true
        run: npm run coverage

      - name: Audit dependencies (high/critical)
        run: npm audit --audit-level=high

      - name: License inventory gate
        run: python hooks/scripts/check_license_inventory.py --check

      - name: Public-release clean gate (emails, absolute paths, private IPs)
        run: python hooks/scripts/check_public_repo_clean.py --repo-root .

      - name: Policy hook unit tests
        run: python -m unittest tests.test_policy_hooks_smoke tests.hooks.test_check_license_inventory -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Official image — returntocorp/semgrep-action@v1 is archived/deprecated.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Scan TypeScript and Python security rules
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/python-security \
            --error \
            --quiet \
            .
